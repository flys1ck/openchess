name: Build

on:
  workflow_dispatch:
  pull_request:
    branches: main

env:
  STOCKFISH_VERSION: 19

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        name: Setup Bun
      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint:check
      - run: bun run types:check
      - run: bun run test:unit --run

  build:
    name: Build
    needs: [frontend-checks]
    strategy:
      matrix:
        include:
          - platform: "ubuntu-22.04"
            arch: "x86_64"
            targetTriple: "x86_64-unknown-linux-gnu"
    runs-on: ${{ matrix.platform }}
    env:
      TARGET_TRIPLE: ${{ matrix.targetTriple }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        name: Setup Bun
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's in an `if` to slightly speed up windows and linux builds.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: bun install --frozen-lockfile
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb
      - uses: actions/cache@v5
        id: stockfish-cache
        with:
          path: |
            external/stockfish
          key: stockfish-${{ env.STOCKFISH_VERSION }}-${{ matrix.targetTriple }}
      - name: Install Stockfish
        run: bun run scripts/downloadStockfish.ts
        if: steps.stockfish-cache.outputs.cache-hit != 'true'
      - name: Generate Target Triple
        run: |
          mkdir src-tauri/bin
          bun run scripts/generateTargetTriple.ts
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --no-bundle
